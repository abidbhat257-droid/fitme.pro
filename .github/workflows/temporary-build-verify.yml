name: Temporary clean production build verification
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Clean build folder
        run: rm -rf frontend/build
      - name: Install dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Production build
        id: build
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          yarn build 2>&1 | tee /tmp/build-output.txt
          code=${PIPESTATUS[0]}
          echo $code > /tmp/build-exit-code.txt
      - name: Pilot overlap verification
        id: overlap
        continue-on-error: true
        if: always()
        working-directory: frontend
        run: |
          code=$(cat /tmp/build-exit-code.txt 2>/dev/null || echo 1)
          if [ "$code" != "0" ]; then echo 'Build failed; overlap verification skipped.' | tee /tmp/overlap-output.txt; exit 1; fi
          python3 - <<'PY' | tee /tmp/overlap-output.txt
import glob,re,html
pilots=[
"how-to-calculate-a-calorie-deficit-for-safe-steady-weight-loss",
"top-10-high-volume-low-calorie-foods-that-keep-you-full",
"keto-vs-low-carb-which-diet-strategy-wins-for-long-term-weight-loss",
"how-to-use-a-smart-scale-to-track-weight-management-progress",
"why-hasnt-my-increased-activity-led-to-weight-loss",
"a-7-day-high-protein-meal-plan-for-sustainable-weight-management",
"how-walking-10-000-steps-a-day-impacts-weight-loss-maintenance",
"how-to-measure-progress-beyond-the-scale-body-composition-metrics",
"body-composition-vs-bmi-why-your-scale-is-lying-to-you",
"what-is-lean-body-mass-and-how-do-you-calculate-it",
"what-counts-as-a-healthy-body-fat-percentage",
"bioelectrical-impedance-analysis-bia-pros-cons-and-accuracy",
"how-to-achieve-body-recomposition-lose-fat-and-gain-muscle-together",
"can-you-build-muscle-in-a-calorie-deficit-the-science-of-recomping",
"body-recomposition-calculators-how-to-find-your-tdee-and-macros"]
files=glob.glob("build/journal/*/*/index.html")
def words(p):
 s=open(p,encoding="utf8").read(); s=re.sub(r"<script[\\s\\S]*?</script>|<style[\\s\\S]*?</style>"," ",s,flags=re.I); s=re.sub(r"<[^>]+>"," ",s); s=html.unescape(s).lower(); return re.findall(r"[a-z0-9]+",s)
data={p:words(p) for p in files}
shingles={p:set(zip(data[p],data[p][1:],data[p][2:],data[p][3:],data[p][4:])) for p in files}
byslug={p.split("/")[-2]:p for p in files}; failed=False
for slug in pilots:
 p=byslug.get(slug)
 if not p: print(slug+" MISSING"); failed=True; continue
base=shingles[p]; best=(0,None)
 for q,qs in shingles.items():
  if q==p: continue
  pct=(len(base & qs)/max(1,len(base)))*100
  if pct>best[0]: best=(pct,q)
print(f"{slug}\\t{best[0]:.2f}%\\t{best[1]}")
 if best[0]>=5: failed=True
if failed: raise SystemExit(1)
PY
      - name: Post real output to verification issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
import os,subprocess
build=open('/tmp/build-output.txt',encoding='utf8').read() if os.path.exists('/tmp/build-output.txt') else 'No build output captured.'
overlap=open('/tmp/overlap-output.txt',encoding='utf8').read() if os.path.exists('/tmp/overlap-output.txt') else 'Overlap verification did not run.'
code=open('/tmp/build-exit-code.txt').read().strip() if os.path.exists('/tmp/build-exit-code.txt') else '1'
status='PASS' if code=='0' and 'MISSING' not in overlap and all(float(line.split('\t')[1].rstrip('%'))<5 for line in overlap.splitlines() if '\t' in line) else 'FAIL'
body='Temporary verification result: '+status+'\nCommit: '+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'\n\nBUILD OUTPUT:\n'+build[-30000:]+'\n\nPILOT OVERLAP:\n'+overlap
subprocess.run(['gh','issue','comment','9','--body',body],check=True)
if status!='PASS': raise SystemExit(1)
PY