name: Temporary lockfile regeneration
on:
  push:
    branches: [main]
jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile from scratch
        run: |
          rm -f yarn.lock
          yarn install --non-interactive
          test -s yarn.lock
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-yarn-lock
          path: frontend/yarn.lock
