name: Temporary lockfile regeneration
on:
  push:
    branches: [main]
    paths-ignore:
      - frontend/yarn.lock
permissions:
  contents: write
  actions: read
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore regenerated lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36897973477 --repo ${{ github.repository }} --name regenerated-yarn-lock --dir /tmp/lock-artifact
          cp /tmp/lock-artifact/yarn.lock frontend/yarn.lock
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Yarn lockfile"
          git push origin HEAD:main
